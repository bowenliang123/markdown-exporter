identity:
  author: bowenliang123
  name: md_exporter
  label:
    en_US: Markdown Exporter
    zh_Hans: Markdown 转换器
    ja_JP: Markdownエクスポーター
  description:
    en_US: Export Markdown to DOCX, PPTX, XLSX, PDF, PNG, SVG, HTML, IPYNB, CSV, JSON, JSONL, XML files, Jira wiki markup, and extract code blocks to Python, Bash, JS and etc files.
    zh_Hans: 导出 Markdown 为 DOCX, PPTX, XLSX, PDF, PNG, SVG, HTML, IPYNB, CSV, JSON, JSONL, XML 文件及 Jira 文本标记, 并将代码块导出为各类脚本文件(Python, JS, Bash等)。
    ja_JP: MarkdownをDOCX, PPTX, XLSX, PDF, PNG, SVG, HTML, IPYNB, CSV, JSON, JSONL, XML ファイルやJira Wikiマークアップとしてエクスポートし、さらにコードブロックを各種スクリプトファイルとしてエクスポートします
  icon: icon.png
tools:
  - tools/md_to_docx/md_to_docx.yaml
  - tools/md_to_pdf/md_to_pdf.yaml
  - tools/md_to_xlsx/md_to_xlsx.yaml
  - tools/md_to_pptx/md_to_pptx.yaml
  - tools/md_to_html/md_to_html.yaml
  - tools/md_to_png/md_to_png.yaml
  - tools/md_to_svg/md_to_svg.yaml
  - tools/md_to_ipynb/md_to_ipynb.yaml
  - tools/md_to_html_text/md_to_html_text.yaml
  - tools/md_to_jira/md_to_jira.yaml
  - tools/md_to_md/md_to_md.yaml
  - tools/md_to_csv/md_to_csv.yaml
  - tools/md_to_json/md_to_json.yaml
  - tools/md_to_xml/md_to_xml.yaml
  - tools/md_to_latex/md_to_latex.yaml
  - tools/md_to_codeblock/md_to_codeblock.yaml
extra:
  python:
    source: provider/md_exporter.py

# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update README image paths to use GitHub raw URLs
        run: |
          # Replace relative image paths with GitHub raw URLs (only for png and jpg)
          sed -i 's|!\[\([^]]*\)\](assets/\([^)]*\)\.\(png\|jpg\))|![\1](https://raw.githubusercontent.com/bowenliang123/md_exporter/refs/heads/main/assets/\2.\3)|g' README.md

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install uv
          python -m uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  github-release:
    name: Attach assets to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Retrieve Python distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Package Dify plugin
        id: package
        run: |
          mkdir -p $RUNNER_TEMP/bin
          cd $RUNNER_TEMP/bin
          wget https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          chmod +x dify-plugin-linux-amd64
          cd $GITHUB_WORKSPACE
          PLUGIN_NAME=$(grep "^name:" manifest.yaml | cut -d' ' -f2)
          VERSION=$(grep "^version:" manifest.yaml | cut -d' ' -f2)
          PACKAGE_NAME="$PLUGIN_NAME-$VERSION.difypkg"
          $RUNNER_TEMP/bin/dify-plugin-linux-amd64 plugin package . -o "$PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/* \
            "${{ steps.package.outputs.package_name }}" \
            --clobber

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
